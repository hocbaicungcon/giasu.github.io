<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">TÍNH CHẤT DIỆN TÍCH HÌNH THANG (HAI ĐƯỜNG CHÉO CẮT NHAU)</text>

  <!-- Hình thang ABCD -->
  <polygon points="150,45 350,45 440,165 60,165" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  
  <!-- Hai đường chéo AC và BD -->
  <line x1="150" y1="45" x2="440" y2="165" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="350" y1="45" x2="60" y2="165" stroke="#2563eb" stroke-width="1.8"/>
  
  <!-- Điểm giao O -->
  <circle cx="250" cy="105" r="4" fill="#1e3a8a"/>
  <text x="250" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">O</text>

  <!-- Đỉnh A, B, C, D -->
  <text x="145" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">A</text>
  <text x="355" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">B</text>
  <text x="450" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">C</text>
  <text x="45" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">D</text>

  <!-- Tô màu và chú thích hai cánh tam giác bằng nhau -->
  <polygon points="150,45 60,165 250,105" fill="#bfdbfe" opacity="0.6"/>
  <polygon points="350,45 440,165 250,105" fill="#bfdbfe" opacity="0.6"/>
  <text x="140" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">S(AOD)</text>
  <text x="330" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">S(BOC)</text>

  <text x="250" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">S(AOB)</text>
  <text x="250" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">S(DOC)</text>

  <!-- Chân trang -->
  <text x="260" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Quy tắc vàng: S(AOD) = S(BOC)  và  S(AOD) × S(BOC) = S(AOB) × S(DOC)</text>
</svg>
