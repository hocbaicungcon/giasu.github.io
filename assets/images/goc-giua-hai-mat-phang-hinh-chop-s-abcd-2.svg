<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="auto" style="max-width:540px;display:block;margin:16px auto;">
  <!-- Apex S: (190, 50) -->
  <!-- Base vertices: A(190, 280), B(100, 360), C(370, 360), D(460, 280) -->
  <!-- Center O: (280, 320) -->
  <!-- Point H on SC: (280, 205) -->

  <!-- Shaded Face SBC (Cyan) -->
  <polygon points="190,50 100,360 370,360" fill="#67e8f9" fill-opacity="0.45"/>
  <!-- Shaded Face SCD (Yellow/Orange) -->
  <polygon points="190,50 370,360 460,280" fill="#fde047" fill-opacity="0.45"/>
  <!-- Shaded Triangle BHD (Teal/Emerald) -->
  <polygon points="100,360 280,205 460,280" fill="#2dd4bf" fill-opacity="0.35"/>

  <!-- Dashed edges: SA, AB, AD, AC, BD, SO -->
  <line x1="190" y1="50" x2="190" y2="280" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="190" y1="280" x2="100" y2="360" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="190" y1="280" x2="460" y2="280" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="190" y1="280" x2="370" y2="360" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="100" y1="360" x2="460" y2="280" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="190" y1="50" x2="280" y2="320" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- Arc at O for angle SOA -->
  <path d="M 268,314 A 18,18 0 0,1 274,302" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Solid edges: BC, CD, SB, SC, SD -->
  <line x1="100" y1="360" x2="370" y2="360" stroke="#6366f1" stroke-width="2.8"/>
  <line x1="370" y1="360" x2="460" y2="280" stroke="#6366f1" stroke-width="2.8"/>
  <line x1="190" y1="50" x2="100" y2="360" stroke="#6366f1" stroke-width="2.8"/>
  <line x1="190" y1="50" x2="370" y2="360" stroke="#6366f1" stroke-width="2.8"/>
  <line x1="190" y1="50" x2="460" y2="280" stroke="#6366f1" stroke-width="2.8"/>

  <!-- Lines BH and DH forming angle BHD at H -->
  <line x1="100" y1="360" x2="280" y2="205" stroke="#0f172a" stroke-width="3"/>
  <line x1="460" y1="280" x2="280" y2="205" stroke="#0f172a" stroke-width="3"/>

  <!-- Angle arc at H for angle BHD -->
  <path d="M 266,218 A 20,20 0 0,0 298,212" fill="none" stroke="#000" stroke-width="2.2"/>

  <!-- Point H dot on SC -->
  <circle cx="280" cy="205" r="4.5" fill="#dc2626"/>

  <!-- Vertex Labels -->
  <text x="175" y="42" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">S</text>
  <text x="170" y="305" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#1e3a8a">A</text>
  <text x="76" y="380" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">B</text>
  <text x="370" y="385" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">C</text>
  <text x="468" y="285" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">D</text>
  <text x="275" y="348" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#1e3a8a">O</text>
  <text x="288" y="198" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">H</text>
</svg>
