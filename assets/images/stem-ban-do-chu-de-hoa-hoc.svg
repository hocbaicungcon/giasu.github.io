<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="auto" style="max-width:740px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgMap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Column Headers -->
    <linearGradient id="hdr10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hdr11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hdr12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="shadowMap" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="740" height="440" rx="14" fill="url(#bgMap)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="110" y="14" width="520" height="34" rx="17" fill="#0f172a" filter="url(#shadowMap)"/>
  <text x="370" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">BẢN ĐỒ CÁC CHỦ ĐỀ DẠY HỌC STEM MÔN HÓA HỌC THPT</text>

  <!-- ================= COLUMN 1: HÓA HỌC 10 ================= -->
  <g transform="translate(25, 68)">
    <rect width="215" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowMap)"/>
    <path d="M0,10 Q0,0 10,0 L205,0 Q215,0 215,10 L215,36 L0,36 Z" fill="url(#hdr10)"/>
    <text x="107" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">STEM HÓA HỌC 10</text>

    <!-- Topic 1 -->
    <rect x="10" y="48" width="195" height="65" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="18" y="68" fill="#0284c7" font-size="11.5" font-weight="800">1. Bình điện phân Giaven</text>
    <text x="18" y="85" fill="#334155" font-size="10">• Điện phân NaCl không màng ngăn</text>
    <text x="18" y="99" fill="#475569" font-size="9.5">• Tẩy trắng vải ố bẩn sinh hoạt</text>

    <!-- Topic 2 -->
    <rect x="10" y="122" width="195" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="142" fill="#0f172a" font-size="11.5" font-weight="700">2. Đèn kéo quân đối lưu</text>
    <text x="18" y="159" fill="#334155" font-size="10">• Phản ứng cháy &amp; dòng đối lưu nhiệt</text>
    <text x="18" y="173" fill="#475569" font-size="9.5">• Truyền thẳng ánh sáng tạo bóng</text>

    <!-- Topic 3 -->
    <rect x="10" y="196" width="195" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="216" fill="#0f172a" font-size="11.5" font-weight="700">3. Bình lọc nước hấp phụ</text>
    <text x="18" y="233" fill="#334155" font-size="10">• Than hoạt tính &amp; cát thạch anh</text>
    <text x="18" y="247" fill="#475569" font-size="9.5">• Hấp phụ ion kim loại &amp; màu</text>

    <!-- Focus badge -->
    <rect x="10" y="272" width="195" height="60" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="107" y="294" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="800">TRỌNG TÂM LỚP 10:</text>
    <text x="107" y="312" text-anchor="middle" fill="#0c4a6e" font-size="10">Phản ứng oxi hóa – khử,</text>
    <text x="107" y="325" text-anchor="middle" fill="#0c4a6e" font-size="10">Halogen, Năng lượng hóa học</text>
  </g>

  <!-- ================= COLUMN 2: HÓA HỌC 11 ================= -->
  <g transform="translate(262, 68)">
    <rect width="215" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowMap)"/>
    <path d="M0,10 Q0,0 10,0 L205,0 Q215,0 215,10 L215,36 L0,36 Z" fill="url(#hdr11)"/>
    <text x="107" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">STEM HÓA HỌC 11</text>

    <!-- Topic 1 -->
    <rect x="10" y="48" width="195" height="65" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="68" fill="#15803d" font-size="11.5" font-weight="800">1. Chỉ thị pH bắp cải tím</text>
    <text x="18" y="85" fill="#334155" font-size="10">• Cân bằng axit – bazơ Brønsted</text>
    <text x="18" y="99" fill="#475569" font-size="9.5">• Chế tạo que thử giấy quỳ pH</text>

    <!-- Topic 2 -->
    <rect x="10" y="122" width="195" height="65" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="142" fill="#15803d" font-size="11.5" font-weight="800">2. Chưng cất tinh dầu</text>
    <text x="18" y="159" fill="#334155" font-size="10">• Lôi cuốn hơi nước tách sả, bưởi</text>
    <text x="18" y="173" fill="#475569" font-size="9.5">• Phễu chiết tách 2 pha kị nước</text>

    <!-- Topic 3 -->
    <rect x="10" y="196" width="195" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="216" fill="#0f172a" font-size="11.5" font-weight="700">3. Pin điện hóa củ quả</text>
    <text x="18" y="233" fill="#334155" font-size="10">• Cặp kim loại Zn - Cu &amp; điện li</text>
    <text x="18" y="247" fill="#475569" font-size="9.5">• Thắp sáng bóng đèn LED mini</text>

    <!-- Focus badge -->
    <rect x="10" y="272" width="195" height="60" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="107" y="294" text-anchor="middle" fill="#166534" font-size="11" font-weight="800">TRỌNG TÂM LỚP 11:</text>
    <text x="107" y="312" text-anchor="middle" fill="#14532d" font-size="10">Sự điện li, Thang pH,</text>
    <text x="107" y="325" text-anchor="middle" fill="#14532d" font-size="10">Tách tinh chế hợp chất hữu cơ</text>
  </g>

  <!-- ================= COLUMN 3: HÓA HỌC 12 ================= -->
  <g transform="translate(500, 68)">
    <rect width="215" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowMap)"/>
    <path d="M0,10 Q0,0 10,0 L205,0 Q215,0 215,10 L215,36 L0,36 Z" fill="url(#hdr12)"/>
    <text x="107" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">STEM HÓA HỌC 12</text>

    <!-- Topic 1 -->
    <rect x="10" y="48" width="195" height="65" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="18" y="68" fill="#b45309" font-size="11.5" font-weight="800">1. Xà phòng từ dầu mỡ</text>
    <text x="18" y="85" fill="#334155" font-size="10">• Xà phòng hóa chất béo Lipit</text>
    <text x="18" y="99" fill="#475569" font-size="9.5">• Cơ chế hạt mixen tẩy rửa</text>

    <!-- Topic 2 -->
    <rect x="10" y="122" width="195" height="65" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="18" y="142" fill="#b45309" font-size="11.5" font-weight="800">2. Lên men cơm rượu</text>
    <text x="18" y="159" fill="#334155" font-size="10">• Đường hóa tinh bột Cacbohiđrat</text>
    <text x="18" y="173" fill="#475569" font-size="9.5">• Lên men rượu etylic &amp; este thơm</text>

    <!-- Topic 3 -->
    <rect x="10" y="196" width="195" height="65" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="18" y="216" fill="#b45309" font-size="11.5" font-weight="800">3. Túi giấy thân chuối</text>
    <text x="18" y="233" fill="#334155" font-size="10">• Sợi xenlulozơ sinh học dai bền</text>
    <text x="18" y="247" fill="#475569" font-size="9.5">• Màng dầu ăn chống thấm nước</text>

    <!-- Focus badge -->
    <rect x="10" y="272" width="195" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="107" y="294" text-anchor="middle" fill="#92400e" font-size="11" font-weight="800">TRỌNG TÂM LỚP 12:</text>
    <text x="107" y="312" text-anchor="middle" fill="#78350f" font-size="10">Este – Lipit, Cacbohiđrat,</text>
    <text x="107" y="325" text-anchor="middle" fill="#78350f" font-size="10">Vật liệu Polyme &amp; Kim loại</text>
  </g>
</svg>
