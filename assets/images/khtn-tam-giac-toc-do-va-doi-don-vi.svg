<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="auto" style="max-width:720px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgSpeed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Triangle Fill Gradient -->
    <linearGradient id="triGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <marker id="arrConvertR" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrConvertL" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>

    <filter id="shadowSpeed" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="720" height="440" rx="14" fill="url(#bgSpeed)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="110" y="14" width="500" height="34" rx="17" fill="#0f172a" filter="url(#shadowSpeed)"/>
  <text x="360" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">TAM GIÁC CÔNG THỨC TỐC ĐỘ (s – v – t) &amp; ĐỔI ĐƠN VỊ ĐO</text>

  <!-- ================= LEFT: MAGIC SPEED TRIANGLE (TAM GIÁC KỲ DIỆU) ================= -->
  <g transform="translate(35, 68)">
    <rect width="320" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowSpeed)"/>
    <rect width="320" height="28" rx="10" fill="#1e293b"/>
    <text x="160" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1. TAM GIÁC CÔNG THỨC s – v – t</text>

    <!-- Big Triangle -->
    <g transform="translate(160, 140)">
      <polygon points="0,-85 100,75 -100,75" fill="url(#triGrad)" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
      <!-- Horizontal dividing line (Phép chia) -->
      <line x1="-68" y1="5" x2="68" y2="5" stroke="#b45309" stroke-width="3"/>
      <!-- Vertical dividing line (Phép nhân) -->
      <line x1="0" y1="5" x2="0" y2="75" stroke="#b45309" stroke-width="3"/>

      <!-- Letters: s on top, v on bottom-left, t on bottom-right -->
      <!-- s (quãng đường) -->
      <text x="0" y="-22" text-anchor="middle" fill="#b91c1c" font-size="28" font-weight="900">s</text>
      <text x="0" y="-3" text-anchor="middle" fill="#7f1d1d" font-size="10" font-weight="600">Quãng đường</text>

      <!-- v (tốc độ) -->
      <text x="-45" y="45" text-anchor="middle" fill="#0369a1" font-size="26" font-weight="900">v</text>
      <text x="-45" y="62" text-anchor="middle" fill="#075985" font-size="9.5" font-weight="600">Tốc độ</text>

      <!-- t (thời gian) -->
      <text x="45" y="45" text-anchor="middle" fill="#15803d" font-size="26" font-weight="900">t</text>
      <text x="45" y="62" text-anchor="middle" fill="#14532d" font-size="9.5" font-weight="600">Thời gian</text>

      <!-- Division & Multiply signs -->
      <circle cx="-75" cy="5" r="9" fill="#ef4444"/>
      <text x="-75" y="9" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900">:</text>
      <circle cx="0" cy="85" r="9" fill="#0284c7"/>
      <text x="0" y="89" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900">×</text>
    </g>

    <!-- 3 Formula Badges below -->
    <rect x="15" y="240" width="290" height="90" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="260" fill="#0369a1" font-size="12" font-weight="800">• Tìm Tốc độ: <tspan fill="#0284c7">v = s / t</tspan></text>
    <text x="25" y="285" fill="#b91c1c" font-size="12" font-weight="800">• Tìm Quãng đường: <tspan fill="#dc2626">s = v × t</tspan></text>
    <text x="25" y="310" fill="#15803d" font-size="12" font-weight="800">• Tìm Thời gian: <tspan fill="#16a34a">t = s / v</tspan></text>
  </g>

  <!-- ================= RIGHT: UNIT CONVERSION (ĐỔI ĐƠN VỊ ĐO) ================= -->
  <g transform="translate(370, 68)">
    <rect width="320" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowSpeed)"/>
    <rect width="320" height="28" rx="10" fill="#15803d"/>
    <text x="160" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2. QUY TẮC ĐỔI ĐƠN VỊ: m/s ⇄ km/h</text>

    <!-- Conversion Diagram Box -->
    <g transform="translate(160, 95)">
      <!-- Unit Box 1: m/s -->
      <rect x="-135" y="-24" width="85" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="-92" y="6" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="900">m/s</text>

      <!-- Unit Box 2: km/h -->
      <rect x="50" y="-24" width="85" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="92" y="6" text-anchor="middle" fill="#15803d" font-size="17" font-weight="900">km/h</text>

      <!-- Arrow Top: m/s -> km/h (Multiply by 3.6) -->
      <path d="M-40,-12 Q0,-32 40,-12" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arrConvertR)"/>
      <rect x="-24" y="-48" width="48" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="0" y="-34" text-anchor="middle" fill="#1d4ed8" font-size="11.5" font-weight="900">× 3,6</text>

      <!-- Arrow Bottom: km/h -> m/s (Divide by 3.6) -->
      <path d="M40,12 Q0,32 -40,12" fill="none" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arrConvertL)"/>
      <rect x="-24" y="28" width="48" height="20" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="0" y="42" text-anchor="middle" fill="#15803d" font-size="11.5" font-weight="900">: 3,6</text>
    </g>

    <!-- Scientific Derivation -->
    <rect x="15" y="165" width="290" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="186" fill="#0f172a" font-size="11.5" font-weight="700">CHỨNG MINH HỆ SỐ 3,6:</text>
    <text x="25" y="206" fill="#475569" font-size="11">1 m/s = <tspan font-weight="700" fill="#0f172a">0,001 km / (1/3600 h)</tspan></text>
    <text x="25" y="224" fill="#1d4ed8" font-size="11.5" font-weight="800">= 0,001 × 3600 = 3,6 km/h</text>

    <!-- Speed Benchmarks in Nature -->
    <rect x="15" y="245" width="290" height="85" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="25" y="265" fill="#92400e" font-size="11" font-weight="800">TỐC ĐỘ MẪU TRONG TỰ NHIÊN:</text>
    <text x="25" y="282" fill="#475569" font-size="10.5">• Người đi bộ: ~1,4 m/s (5 km/h)</text>
    <text x="25" y="298" fill="#475569" font-size="10.5">• Xe ô tô cao tốc: ~28 m/s (100 km/h)</text>
    <text x="25" y="314" fill="#475569" font-size="10.5">• Vận tốc âm thanh: ~340 m/s (1224 km/h)</text>
  </g>
</svg>
