<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SƠ ĐỒ ĐOẠN THẲNG BÀI TOÁN HIỆU - TỈ (TỈ SỐ 2/5)</text>
  
  <!-- Số bé: 2 phần -->
  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số bé:</text>
  <rect x="110" y="50" width="55" height="22" rx="3" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="170" y="50" width="55" height="22" rx="3" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Số lớn: 5 phần (2 phần bằng số bé + 3 phần hiệu) -->
  <text x="40" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số lớn:</text>
  <rect x="110" y="100" width="55" height="22" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="170" y="100" width="55" height="22" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="230" y="100" width="55" height="22" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="290" y="100" width="55" height="22" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="350" y="100" width="55" height="22" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Ngoặc chỉ Hiệu -->
  <path d="M 230 128 L 405 128" stroke="#ea580c" stroke-width="2"/>
  <line x1="230" y1="124" x2="230" y2="132" stroke="#ea580c" stroke-width="2"/>
  <line x1="405" y1="124" x2="405" y2="132" stroke="#ea580c" stroke-width="2"/>
  <text x="317" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c">Hiệu H (5 − 2 = 3 phần)</text>

  <!-- Chân trang -->
  <text x="270" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Giá trị một phần = Hiệu : (5 − 2)  |  Số bé = 1 phần × 2  |  Số lớn = Số bé + Hiệu</text>
</svg>
