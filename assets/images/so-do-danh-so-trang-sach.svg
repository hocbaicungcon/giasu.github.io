<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">PHÂN NHÓM CHỮ SỐ KHI ĐÁNH SỐ TRANG SÁCH</text>

  <!-- Nhóm 1 chữ số: 1 - 9 -->
  <rect x="30" y="50" width="110" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Trang 1 − 9</text>
  <text x="85" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">9 trang (9 chữ số)</text>

  <!-- Nhóm 2 chữ số: 10 - 99 -->
  <rect x="160" y="50" width="160" height="50" rx="5" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
  <text x="240" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Trang 10 − 99</text>
  <text x="240" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#713f12">90 trang (180 chữ số)</text>

  <!-- Nhóm 3 chữ số: 100 - 999 -->
  <rect x="340" y="50" width="170" height="50" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="425" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">Trang 100 − 999</text>
  <text x="425" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">900 trang (2700 chữ số)</text>

  <!-- Mốc tích lũy -->
  <line x1="30" y1="125" x2="510" y2="125" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="140" cy="125" r="4" fill="#3b82f6"/>
  <text x="140" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Hết trang 9: 9 CS</text>
  
  <circle cx="320" cy="125" r="4" fill="#eab308"/>
  <text x="320" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Hết trang 99: 189 CS</text>

  <circle cx="510" cy="125" r="4" fill="#22c55e"/>
  <text x="460" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">Hết trang 999: 2889 CS</text>
</svg>
