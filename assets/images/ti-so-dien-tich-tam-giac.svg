<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">TỈ SỐ DIỆN TÍCH TAM GIÁC (CHUNG ĐÁY HOẶC CHUNG CHIỀU CAO)</text>

  <!-- Tam giác ABC -->
  <polygon points="210,40 60,170 440,170" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <!-- Điểm M trên BC sao cho MC = 1/3 BC -->
  <!-- BC dài 380, M cách C 126.7 => xM = 313, yM = 170 -->
  <line x1="210" y1="40" x2="313" y2="170" stroke="#d97706" stroke-width="2"/>
  <circle cx="313" cy="170" r="4" fill="#d97706"/>
  <!-- Điểm N trên AC sao cho NC = 1/3 AC -->
  <!-- A(210,40), C(440,170) => N = (363, 127) -->
  <line x1="313" y1="170" x2="363" y2="127" stroke="#dc2626" stroke-width="2"/>
  <circle cx="363" cy="127" r="4" fill="#dc2626"/>

  <!-- Tô màu tam giác MNC -->
  <polygon points="313,170 363,127 440,170" fill="#fca5a5" opacity="0.6" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Tên đỉnh -->
  <text x="210" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">A</text>
  <text x="45" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">B</text>
  <text x="450" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">C</text>
  <text x="313" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">M</text>
  <text x="375" y="128" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">N</text>

  <!-- Chú thích tỉ số -->
  <text x="365" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">S_MNC</text>
  <text x="180" y="120" font-family="system-ui, sans-serif" font-size="11" fill="#0369a1">S(ABM) = 2/3 S(ABC)</text>
  <text x="260" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">S(AMC) = 1/3 S(ABC)  |  S(MNC) = 1/3 S(AMC) = 1/9 S(ABC)</text>
</svg>
