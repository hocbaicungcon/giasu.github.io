<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="100%" height="auto" style="max-width:740px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgCabbage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Test Tube Glass Gradients -->
    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="shadowCab" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="740" height="480" rx="14" fill="url(#bgCabbage)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="90" y="14" width="560" height="34" rx="17" fill="#0f172a" filter="url(#shadowCab)"/>
  <text x="370" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">THANG MÀU CHỈ THỊ pH TỰ NHIÊN TỪ BẮP CẢI TÍM (ANTHOCYANIN)</text>

  <!-- ================= 7 REPRESENTATIVE TEST TUBES ALONG pH SCALE ================= -->

  <!-- Tube Rack Base -->
  <rect x="30" y="275" width="680" height="14" rx="4" fill="#94a3b8" filter="url(#shadowCab)"/>
  <rect x="25" y="289" width="690" height="10" rx="2" fill="#64748b"/>

  <!-- TUBE 1: pH 1-2 (Red / Đỏ đậm) -->
  <g transform="translate(60, 95)">
    <!-- Liquid -->
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#e11d48"/>
    <!-- Glass Tube Outline -->
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- Color Label -->
    <text x="22" y="200" text-anchor="middle" fill="#be123c" font-size="11" font-weight="800">Đỏ đậm</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="22" y="226" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="900">pH 1 – 2</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Axit dạ dày</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">HCl 0.1M</text>
  </g>

  <!-- TUBE 2: pH 3-4 (Pink-Violet / Hồng tím) -->
  <g transform="translate(155, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#d946ef"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#a21caf" font-size="11" font-weight="800">Hồng tím</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="22" y="226" text-anchor="middle" fill="#86198f" font-size="12" font-weight="900">pH 3 – 4</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Nước chanh</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">Giấm ăn</text>
  </g>

  <!-- TUBE 3: pH 5-6 (Violet-Purple / Tím nhạt) -->
  <g transform="translate(250, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#9333ea"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#7e22ce" font-size="11" font-weight="800">Tím hồng</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="22" y="226" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="900">pH 5 – 6</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Cà phê</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">Nước mưa</text>
  </g>

  <!-- TUBE 4: pH 7 (Pure Violet / Tím chuẩn - Trung tính) -->
  <g transform="translate(345, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#6366f1"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="800">Tím đặc trưng</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="22" y="226" text-anchor="middle" fill="#3730a3" font-size="12" font-weight="900">pH = 7</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="700">Nước cất</text>
    <text x="22" y="263" text-anchor="middle" fill="#1e40af" font-size="9.5">TRUNG TÍNH</text>
  </g>

  <!-- TUBE 5: pH 8-9 (Blue / Xanh lam) -->
  <g transform="translate(440, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#0284c7"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="800">Xanh lam</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="22" y="226" text-anchor="middle" fill="#075985" font-size="12" font-weight="900">pH 8 – 9</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Baking soda</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">Nước biển</text>
  </g>

  <!-- TUBE 6: pH 10-11 (Green / Xanh lục) -->
  <g transform="translate(535, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#16a34a"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#15803d" font-size="11" font-weight="800">Xanh lục</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="22" y="226" text-anchor="middle" fill="#166534" font-size="12" font-weight="900">pH 10 – 11</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Nước xà phòng</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">Nước vôi trong</text>
  </g>

  <!-- TUBE 7: pH 12-14 (Yellow-Green / Vàng lục) -->
  <g transform="translate(630, 95)">
    <path d="M6,70 L6,160 Q6,175 22,175 Q38,175 38,160 L38,70 Z" fill="#ca8a04"/>
    <path d="M6,10 L6,160 Q6,175 22,175 Q38,175 38,160 L38,10" fill="none" stroke="#475569" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="16" ry="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <path d="M8,12 L8,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="22" y="200" text-anchor="middle" fill="#a16207" font-size="11" font-weight="800">Vàng nhạt</text>
    <rect x="-8" y="210" width="60" height="24" rx="4" fill="#fef9c3" stroke="#fde047"/>
    <text x="22" y="226" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="900">pH 12 – 14</text>
    <text x="22" y="250" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Nước tẩy Javen</text>
    <text x="22" y="263" text-anchor="middle" fill="#64748b" font-size="9.5">NaOH 0.1M</text>
  </g>

  <!-- ================= TOP ACID / BASE SPECTRUM ARROWS ================= -->
  <!-- Acid Range Arrow (Left) -->
  <line x1="70" y1="65" x2="340" y2="65" stroke="#e11d48" stroke-width="2.5"/>
  <polygon points="65,65 75,60 75,70" fill="#e11d48"/>
  <text x="180" y="58" text-anchor="middle" fill="#be123c" font-size="11" font-weight="800">MÔI TRƯỜNG AXIT (pH &lt; 7)</text>

  <!-- Base Range Arrow (Right) -->
  <line x1="400" y1="65" x2="670" y2="65" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="675,65 665,60 665,70" fill="#0284c7"/>
  <text x="560" y="58" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="800">MÔI TRƯỜNG BAZƠ (pH &gt; 7)</text>

  <!-- Center Indicator -->
  <circle cx="370" cy="65" r="4" fill="#6366f1"/>

  <!-- ================= BOTTOM STRIP: HANDMADE pH PAPER PROCEDURE ================= -->
  <g transform="translate(35, 320)">
    <rect width="670" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowCab)"/>
    <rect width="670" height="28" rx="10" fill="#1e293b"/>
    <text x="335" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">QUY TRÌNH CHẾ TẠO GIẤY QUỲ TÍM HANDMADE TỪ BẮP CẢI TÍM</text>

    <!-- 4 Steps in Procedure -->
    <!-- Step 1 -->
    <rect x="15" y="38" width="145" height="85" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
    <circle cx="30" cy="52" r="8" fill="#d946ef"/>
    <text x="30" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">1</text>
    <text x="44" y="56" fill="#86198f" font-size="11" font-weight="700">Chiết dịch màu</text>
    <text x="22" y="74" fill="#475569" font-size="9.5">Thái nhỏ 200g bắp cải tím,</text>
    <text x="22" y="88" fill="#475569" font-size="9.5">hãm nước sôi 15 phút,</text>
    <text x="22" y="102" fill="#475569" font-size="9.5">lọc lấy dung dịch cốt tím.</text>

    <!-- Step 2 -->
    <rect x="180" y="38" width="145" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="195" cy="52" r="8" fill="#2563eb"/>
    <text x="195" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">2</text>
    <text x="209" y="56" fill="#1d4ed8" font-size="11" font-weight="700">Tẩm giấy lọc</text>
    <text x="187" y="74" fill="#475569" font-size="9.5">Ngâm giấy lọc / A4 dày</text>
    <text x="187" y="88" fill="#475569" font-size="9.5">vào nước bắp cải đậm đặc</text>
    <text x="187" y="102" fill="#475569" font-size="9.5">trong 10 – 15 phút.</text>

    <!-- Step 3 -->
    <rect x="345" y="38" width="145" height="85" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <circle cx="360" cy="52" r="8" fill="#d97706"/>
    <text x="360" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">3</text>
    <text x="374" y="56" fill="#b45309" font-size="11" font-weight="700">Sấy khô trong tối</text>
    <text x="352" y="74" fill="#475569" font-size="9.5">Phơi hoặc sấy nhẹ trong bóng</text>
    <text x="352" y="88" fill="#475569" font-size="9.5">râm (tránh ánh nắng gắt làm</text>
    <text x="352" y="102" fill="#475569" font-size="9.5">phân hủy Anthocyanin).</text>

    <!-- Step 4 -->
    <rect x="510" y="38" width="145" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="525" cy="52" r="8" fill="#16a34a"/>
    <text x="525" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">4</text>
    <text x="539" y="56" fill="#15803d" font-size="11" font-weight="700">Cắt que &amp; Sử dụng</text>
    <text x="517" y="74" fill="#475569" font-size="9.5">Cắt thành dải 1x6 cm,</text>
    <text x="517" y="88" fill="#475569" font-size="9.5">chấm mẫu thử đo pH</text>
    <text x="517" y="102" fill="#475569" font-size="9.5">đất, nước sinh hoạt.</text>
  </g>
</svg>
