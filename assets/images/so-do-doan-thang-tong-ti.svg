<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SƠ ĐỒ ĐOẠN THẲNG BÀI TOÁN TỔNG - TỈ (TỈ SỐ 2/3)</text>
  
  <!-- Số bé: 2 phần -->
  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số bé:</text>
  <rect x="110" y="50" width="65" height="22" rx="3" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="180" y="50" width="65" height="22" rx="3" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="177" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">2 phần bằng nhau</text>

  <!-- Số lớn: 3 phần -->
  <text x="40" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số lớn:</text>
  <rect x="110" y="100" width="65" height="22" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="180" y="100" width="65" height="22" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="250" y="100" width="65" height="22" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <text x="212" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0284c7">3 phần bằng nhau</text>

  <!-- Ngoặc tổng -->
  <path d="M 330 48 C 355 86, 355 86, 330 124" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="365" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tổng T</text>

  <!-- Công thức chân trang -->
  <text x="270" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Giá trị một phần = Tổng : (2 + 3)  |  Số bé = 1 phần × 2  |  Số lớn = 1 phần × 3</text>
</svg>
