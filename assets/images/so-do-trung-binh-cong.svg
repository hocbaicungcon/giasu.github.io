<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">MÔ HÌNH SAN BẰNG GIÁ TRỊ VỀ MỨC TRUNG BÌNH CỘNG</text>

  <!-- Cột 1 -->
  <rect x="50" y="60" width="60" height="70" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">20 kg</text>
  <text x="80" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Bao 1</text>

  <!-- Cột 2 -->
  <rect x="150" y="40" width="60" height="90" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">30 kg</text>
  <text x="180" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Bao 2</text>

  <!-- Cột 3 -->
  <rect x="250" y="74" width="60" height="56" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">16 kg</text>
  <text x="280" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Bao 3</text>

  <!-- Mũi tên san bằng -->
  <path d="M 330 95 L 365 95" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="365,90 375,95 365,100" fill="#0284c7"/>

  <!-- Kết quả TBC -->
  <rect x="400" y="56" width="70" height="74" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <text x="435" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">22 kg</text>
  <text x="435" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Mức TBC</text>

  <!-- Chân trang -->
  <text x="260" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Số trung bình cộng = (20 + 30 + 16) : 3 = 66 : 3 = 22 kg</text>
</svg>
