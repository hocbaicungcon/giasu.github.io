<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="auto" style="max-width:540px;display:block;margin:16px auto;">
  <defs>
    <linearGradient id="pGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="qGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Giao tuyen Delta line behind Q -->
  <line x1="390" y1="35" x2="390" y2="425" stroke="#1d4ed8" stroke-width="2.8"/>

  <!-- Plane (P) -->
  <polygon points="160,100 390,110 390,345 160,335" fill="url(#pGrad3)" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Plane P Corner Arc & Label -->
  <path d="M 160,305 A 30,30 0 0,0 190,336" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="168" y="325" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="20" fill="#000">P</text>

  <!-- Plane (Q) hidden bottom-back edge (dashed) -->
  <line x1="270" y1="355" x2="390" y2="345" stroke="#15803d" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- Plane (Q) polygon -->
  <polygon points="390,110 270,195 270,435 390,345" fill="url(#qGrad3)" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Plane Q Corner Arc & Label -->
  <path d="M 270,405 A 30,30 0 0,0 300,412" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="277" y="425" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="20" fill="#000">Q</text>

  <!-- Line a in plane P, perpendicular to Delta at I(390, 220) -->
  <line x1="205" y1="215" x2="390" y2="220" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="205" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#000">a</text>

  <!-- Line b in plane Q, perpendicular to Delta at I(390, 220) -->
  <line x1="390" y1="220" x2="305" y2="290" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
  <text x="325" y="295" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#000">b</text>

  <!-- Angle arc at point I between line a and line b -->
  <path d="M 358,219 A 32,32 0 0,0 368,238" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Point I -->
  <circle cx="390" cy="220" r="4.5" fill="#dc2626"/>
  <text x="400" y="226" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#1e3a8a">I</text>

  <!-- Label for Delta -->
  <text x="402" y="395" font-family="'STIX Two Text', serif" font-size="22" font-weight="700" fill="#000">Δ</text>
</svg>
