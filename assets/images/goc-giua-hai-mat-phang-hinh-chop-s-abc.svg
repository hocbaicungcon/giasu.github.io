<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="auto" style="max-width:540px;display:block;margin:16px auto;">
  <!-- Apex S: (140, 45) -->
  <!-- Base vertices: A(140, 275), B(310, 375), C(470, 275) -->
  <!-- Midpoint E of AB: (225, 325) -->
  <!-- Midpoint F of AC: (305, 275) -->

  <!-- Shaded Face SBC (Yellow) -->
  <polygon points="140,45 310,375 470,275" fill="#fef08a" fill-opacity="0.55"/>

  <!-- Shaded Face SEF (Pink/Magenta) -->
  <polygon points="140,45 225,325 305,275" fill="#f472b6" fill-opacity="0.65"/>

  <!-- Dashed edges: AC, EF, SF -->
  <line x1="140" y1="275" x2="470" y2="275" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="225" y1="325" x2="305" y2="275" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="140" y1="45" x2="305" y2="275" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7,5"/>

  <!-- Solid edges: SA, AB, BC, SB, SC, SE -->
  <line x1="140" y1="45" x2="140" y2="275" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="140" y1="275" x2="310" y2="375" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="310" y1="375" x2="470" y2="275" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="140" y1="45" x2="310" y2="375" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="140" y1="45" x2="470" y2="275" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="140" y1="45" x2="225" y2="325" stroke="#1e3a8a" stroke-width="2.8"/>

  <!-- Right angle mark at B in base ABC -->
  <path d="M 297.9,367.9 L 309.8,360.5 L 321.9,367.6" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round"/>

  <!-- Vertices E and F dots -->
  <circle cx="225" cy="325" r="3.5" fill="#dc2626"/>
  <circle cx="305" cy="275" r="3.5" fill="#dc2626"/>

  <!-- Vertex Labels -->
  <text x="125" y="38" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">S</text>
  <text x="115" y="295" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">A</text>
  <text x="310" y="405" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">B</text>
  <text x="478" y="285" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="24" fill="#1e3a8a">C</text>
  <text x="205" y="350" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#1e3a8a">E</text>
  <text x="312" y="300" font-family="'STIX Two Text', serif" font-style="italic" font-weight="700" font-size="22" fill="#1e3a8a">F</text>
</svg>
