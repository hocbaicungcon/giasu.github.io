<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="auto" style="max-width:680px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="optBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Warm Source Radial -->
    <radialGradient id="srcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Beam Area Fill -->
    <linearGradient id="umbraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.45"/>
    </linearGradient>

    <filter id="shadowOpt" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" rx="14" fill="url(#optBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="90" y="14" width="500" height="34" rx="17" fill="#0f172a" filter="url(#shadowOpt)"/>
  <text x="340" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">NGUYÊN LÝ QUANG HỌC: ĐỊNH LUẬT TRUYỀN THẲNG &amp; TẠO BÓNG</text>

  <!-- ================= LIGHT SOURCE S (Ngọn nến ở tâm) ================= -->
  <g transform="translate(90, 200)">
    <circle cx="0" cy="0" r="36" fill="url(#srcGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <text x="-4" y="26" text-anchor="middle" fill="#b45309" font-size="13" font-weight="800">S</text>
    <text x="0" y="42" text-anchor="middle" fill="#78350f" font-size="11" font-weight="600">(Ngọn nến)</text>
  </g>

  <!-- ================= LIGHT BEAMS & UMBRA REGION ================= -->
  <!-- Illuminated Region Upper/Lower Boundaries -->
  <polygon points="90,200 600,60 600,340" fill="#fef08a" fill-opacity="0.15"/>

  <!-- Shadow Cone (Vùng bóng tối phía sau hình nhân) -->
  <polygon points="310,130 310,270 540,320 540,80" fill="url(#umbraGrad)"/>

  <!-- Straight Light Rays (Tia sáng truyền thẳng) -->
  <!-- Ray 1: S -> A -> A' -->
  <line x1="90" y1="200" x2="540" y2="80" stroke="#f59e0b" stroke-width="2"/>
  <line x1="540" y1="80" x2="600" y2="64" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Ray 2: S -> B -> B' -->
  <line x1="90" y1="200" x2="540" y2="320" stroke="#f59e0b" stroke-width="2"/>
  <line x1="540" y1="320" x2="600" y2="336" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Optical Axis (Trục quang chính) -->
  <line x1="90" y1="200" x2="580" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ================= OPAQUE OBJECT (Hình nhân cản sáng AB trên lồng quay) ================= -->
  <!-- Inner Rotating Cylinder Arc (Vết lồng trong) -->
  <path d="M310,100 A220,220 0 0,1 310,300" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="250" y="98" fill="#1d4ed8" font-size="11" font-weight="700">Lồng trong (quay tròn)</text>

  <!-- Object AB: Silhouette of Soldier/Horse -->
  <rect x="306" y="130" width="8" height="140" rx="3" fill="#0f172a"/>
  <!-- Visual Soldier Silhouette for clarity -->
  <g transform="translate(305, 145) scale(0.65)" fill="#0f172a">
    <circle cx="15" cy="15" r="8"/>
    <path d="M8,26 L22,26 L26,65 L4,65 Z"/>
    <line x1="15" y1="26" x2="35" y2="45" stroke="#0f172a" stroke-width="4"/>
    <line x1="38" y1="5" x2="30" y2="85" stroke="#0f172a" stroke-width="3"/>
    <polygon points="38,0 33,8 43,8"/>
    <line x1="9" y1="65" x2="4" y2="105" stroke="#0f172a" stroke-width="4"/>
    <line x1="21" y1="65" x2="26" y2="105" stroke="#0f172a" stroke-width="4"/>
  </g>
  <circle cx="310" cy="130" r="4" fill="#ef4444"/>
  <text x="294" y="135" fill="#ef4444" font-size="13" font-weight="800">A</text>
  <circle cx="310" cy="270" r="4" fill="#ef4444"/>
  <text x="294" y="275" fill="#ef4444" font-size="13" font-weight="800">B</text>

  <!-- Object Motion Vector v_in -->
  <path d="M315,115 L335,115" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="335,111 343,115 335,119" fill="#2563eb"/>
  <text x="348" y="119" fill="#2563eb" font-size="11" font-weight="700">v₁ = ω·d</text>

  <!-- ================= TRANSLUCENT SCREEN (Thành giấy mờ lồng ngoài) ================= -->
  <!-- Outer Cylinder Screen Arc (Vách giấy nến) -->
  <path d="M540,65 A450,450 0 0,1 540,335" fill="none" stroke="#ca8a04" stroke-width="4"/>
  <rect x="536" y="65" width="8" height="270" fill="#fef3c7" fill-opacity="0.5"/>
  <text x="555" y="75" fill="#b45309" font-size="12" font-weight="700">Giấy mờ lồng ngoài</text>

  <!-- Projected Shadow A'B' (Bóng in lên màn giấy mờ) -->
  <rect x="536" y="80" width="8" height="240" fill="#1e293b"/>
  <!-- Magnified Silhouette Shadow -->
  <g transform="translate(540, 105) scale(1.1)" fill="#0f172a" fill-opacity="0.85">
    <circle cx="15" cy="15" r="8"/>
    <path d="M8,26 L22,26 L26,65 L4,65 Z"/>
    <line x1="15" y1="26" x2="35" y2="45" stroke="#0f172a" stroke-width="4"/>
    <line x1="38" y1="5" x2="30" y2="85" stroke="#0f172a" stroke-width="3"/>
    <polygon points="38,0 33,8 43,8"/>
    <line x1="9" y1="65" x2="4" y2="105" stroke="#0f172a" stroke-width="4"/>
    <line x1="21" y1="65" x2="26" y2="105" stroke="#0f172a" stroke-width="4"/>
  </g>
  <circle cx="540" cy="80" r="4" fill="#dc2626"/>
  <text x="555" y="86" fill="#dc2626" font-size="13" font-weight="800">A'</text>
  <circle cx="540" cy="320" r="4" fill="#dc2626"/>
  <text x="555" y="325" fill="#dc2626" font-size="13" font-weight="800">B'</text>

  <!-- Shadow Motion Vector v_out -->
  <path d="M545,95 L575,95" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="575,91 583,95 575,99" fill="#dc2626"/>
  <text x="588" y="99" fill="#dc2626" font-size="11" font-weight="700">v₂ = ω·d'</text>

  <!-- ================= DIMENSIONS & OPTICS FORMULAS ================= -->
  <!-- Distance d: Source to Object -->
  <line x1="90" y1="365" x2="310" y2="365" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="358" x2="90" y2="372" stroke="#64748b" stroke-width="1.5"/>
  <line x1="310" y1="358" x2="310" y2="372" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="382" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">d (Khoảng cách nến – vật)</text>

  <!-- Distance d': Source to Screen -->
  <line x1="90" y1="345" x2="540" y2="345" stroke="#475569" stroke-width="1.5"/>
  <line x1="540" y1="338" x2="540" y2="352" stroke="#475569" stroke-width="1.5"/>
  <text x="425" y="340" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">d' (Khoảng cách nến – màn giấy)</text>

  <!-- Formula Callout Card -->
  <rect x="25" y="65" width="230" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowOpt)"/>
  <text x="35" y="85" fill="#0f172a" font-size="12" font-weight="700">HỆ THỨC PHÓNG ĐẠI BÓNG:</text>
  <text x="35" y="108" fill="#2563eb" font-size="13" font-weight="700">ΔSAB ∼ ΔSA'B' ⇒ A'B'/AB = d'/d &gt; 1</text>
  <text x="35" y="126" fill="#475569" font-size="10.5">• d' &gt; d: Bóng luôn phóng đại rõ rệt</text>
  <text x="35" y="142" fill="#475569" font-size="10.5">• Lồng quay đều: bóng lướt sống động</text>
</svg>
