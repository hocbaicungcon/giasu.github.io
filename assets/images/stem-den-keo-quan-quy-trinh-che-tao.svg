<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="auto" style="max-width:760px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="stepBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Step Card Headers -->
    <linearGradient id="header1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="header2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="header3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="header4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Connect Arrow -->
    <marker id="stepArrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>

    <filter id="shadowStep" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="380" rx="14" fill="url(#stepBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Main Title -->
  <rect x="130" y="14" width="500" height="34" rx="17" fill="#0f172a" filter="url(#shadowStep)"/>
  <text x="380" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">QUY TRÌNH 4 BƯỚC THIẾT KẾ VÀ CHẾ TẠO ĐÈN KÉO QUÂN</text>

  <!-- ================= STEP 1 ================= -->
  <g transform="translate(18, 68)">
    <rect width="168" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowStep)"/>
    <!-- Card Header -->
    <path d="M0,10 Q0,0 10,0 L158,0 Q168,0 168,10 L168,36 L0,36 Z" fill="url(#header1)"/>
    <circle cx="20" cy="18" r="10" fill="#ffffff"/>
    <text x="20" y="22" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="800">1</text>
    <text x="36" y="22" fill="#ffffff" font-size="12" font-weight="700">LÀM KHUNG &amp; ĐẾ</text>

    <!-- Illustration 1 -->
    <rect x="14" y="46" width="140" height="110" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <!-- Base Ellipse -->
    <ellipse cx="84" cy="130" rx="48" ry="12" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
    <!-- Vents -->
    <rect x="52" y="128" width="10" height="5" rx="2" fill="#1e293b"/>
    <rect x="79" y="130" width="10" height="5" rx="2" fill="#1e293b"/>
    <rect x="106" y="128" width="10" height="5" rx="2" fill="#1e293b"/>
    <!-- Spindle -->
    <line x1="84" y1="126" x2="84" y2="60" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="82,60 86,60 84,54" fill="#0f172a"/>
    <!-- Candle placeholder -->
    <rect x="80" y="112" width="8" height="14" fill="#fef08a" stroke="#ca8a04"/>
    <circle cx="84" cy="108" r="3" fill="#ea580c"/>

    <!-- Content Bullet Points -->
    <text x="14" y="172" fill="#0f172a" font-size="11" font-weight="700">• Làm đế đèn chắc chắn</text>
    <text x="14" y="190" fill="#475569" font-size="10">Khoét 4–6 lỗ thông khí ở</text>
    <text x="14" y="204" fill="#475569" font-size="10">chân đế để nạp khí lạnh.</text>

    <text x="14" y="226" fill="#0f172a" font-size="11" font-weight="700">• Dựng kim trục xoay</text>
    <text x="14" y="244" fill="#475569" font-size="10">Cắm kim khâu/que thép</text>
    <text x="14" y="258" fill="#475569" font-size="10">thẳng đứng, mài nhọn đỉnh.</text>

    <text x="14" y="280" fill="#0f172a" font-size="11" font-weight="700">• Đặt đế đỡ nến an toàn</text>
    <text x="14" y="296" fill="#475569" font-size="10">Bảo đảm chống cháy, đổ.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="215" x2="204" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- ================= STEP 2 ================= -->
  <g transform="translate(206, 68)">
    <rect width="168" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowStep)"/>
    <!-- Card Header -->
    <path d="M0,10 Q0,0 10,0 L158,0 Q168,0 168,10 L168,36 L0,36 Z" fill="url(#header2)"/>
    <circle cx="20" cy="18" r="10" fill="#ffffff"/>
    <text x="20" y="22" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="800">2</text>
    <text x="36" y="22" fill="#ffffff" font-size="12" font-weight="700">GẤP CÁNH QUẠT</text>

    <!-- Illustration 2 -->
    <rect x="14" y="46" width="140" height="110" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <g transform="translate(84, 101) scale(0.65)">
      <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
      <!-- Radiating angled blades -->
      <line x1="18" y1="0" x2="60" y2="0" stroke="#0284c7" stroke-width="2"/>
      <line x1="0" y1="18" x2="0" y2="60" stroke="#0284c7" stroke-width="2"/>
      <line x1="-18" y1="0" x2="-60" y2="0" stroke="#0284c7" stroke-width="2"/>
      <line x1="0" y1="-18" x2="0" y2="-60" stroke="#0284c7" stroke-width="2"/>
      <line x1="12" y1="12" x2="42" y2="42" stroke="#0284c7" stroke-width="2"/>
      <line x1="-12" y1="12" x2="-42" y2="42" stroke="#0284c7" stroke-width="2"/>
      <line x1="-12" y1="-12" x2="-42" y2="-42" stroke="#0284c7" stroke-width="2"/>
      <line x1="12" y1="-12" x2="42" y2="-42" stroke="#0284c7" stroke-width="2"/>
    </g>

    <!-- Content Bullet Points -->
    <text x="14" y="172" fill="#0f172a" font-size="11" font-weight="700">• Cắt phôi tròn D=14-16cm</text>
    <text x="14" y="190" fill="#475569" font-size="10">Bìa mỏng nhẹ hoặc giấy</text>
    <text x="14" y="204" fill="#475569" font-size="10">dày giữ nếp tốt.</text>

    <text x="14" y="226" fill="#0f172a" font-size="11" font-weight="700">• Chia nan &amp; gập nghiêng</text>
    <text x="14" y="244" fill="#475569" font-size="10">Cắt 8-12 cánh, gập đều góc</text>
    <text x="14" y="258" fill="#475569" font-size="10">30°–45° cùng một chiều.</text>

    <text x="14" y="280" fill="#0f172a" font-size="11" font-weight="700">• Gắn chén tì tâm quạt</text>
    <text x="14" y="296" fill="#475569" font-size="10">Dán cúc/nắp lon giảm ma sát.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="378" y1="215" x2="392" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- ================= STEP 3 ================= -->
  <g transform="translate(394, 68)">
    <rect width="168" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowStep)"/>
    <!-- Card Header -->
    <path d="M0,10 Q0,0 10,0 L158,0 Q168,0 168,10 L168,36 L0,36 Z" fill="url(#header3)"/>
    <circle cx="20" cy="18" r="10" fill="#ffffff"/>
    <text x="20" y="22" text-anchor="middle" fill="#d97706" font-size="12" font-weight="800">3</text>
    <text x="36" y="22" fill="#ffffff" font-size="12" font-weight="700">DỰNG LỒNG QUAY</text>

    <!-- Illustration 3 -->
    <rect x="14" y="46" width="140" height="110" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <g transform="translate(84, 101)">
      <!-- Inner Frame Ring -->
      <ellipse cx="0" cy="-35" rx="35" ry="8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <ellipse cx="0" cy="35" rx="35" ry="8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <line x1="-35" y1="-35" x2="-35" y2="35" stroke="#2563eb" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="35" y1="-35" x2="35" y2="35" stroke="#2563eb" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Small Silhouettes -->
      <circle cx="-16" cy="5" r="4" fill="#0f172a"/>
      <path d="M-18,9 L-14,9 L-12,24 L-20,24 Z" fill="#0f172a"/>
      <circle cx="16" cy="5" r="4" fill="#0f172a"/>
      <path d="M14,9 L18,9 L20,24 L12,24 Z" fill="#0f172a"/>
    </g>

    <!-- Content Bullet Points -->
    <text x="14" y="172" fill="#0f172a" font-size="11" font-weight="700">• Làm khung trụ lồng trong</text>
    <text x="14" y="190" fill="#475569" font-size="10">Dùng que tăm/dây thép nhẹ</text>
    <text x="14" y="204" fill="#475569" font-size="10">nối với chong chóng.</text>

    <text x="14" y="226" fill="#0f172a" font-size="11" font-weight="700">• Cắt dán hình nhân</text>
    <text x="14" y="244" fill="#475569" font-size="10">Cắt hình quân lính, động vật</text>
    <text x="14" y="258" fill="#475569" font-size="10">bằng giấy bìa màu đen đậm.</text>

    <text x="14" y="280" fill="#0f172a" font-size="11" font-weight="700">• Cân bằng trọng lượng</text>
    <text x="14" y="296" fill="#475569" font-size="10">Phân bố đều để tránh đảo trục.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="566" y1="215" x2="580" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- ================= STEP 4 ================= -->
  <g transform="translate(582, 68)">
    <rect width="168" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowStep)"/>
    <!-- Card Header -->
    <path d="M0,10 Q0,0 10,0 L158,0 Q168,0 168,10 L168,36 L0,36 Z" fill="url(#header4)"/>
    <circle cx="20" cy="18" r="10" fill="#ffffff"/>
    <text x="20" y="22" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="800">4</text>
    <text x="36" y="22" fill="#ffffff" font-size="12" font-weight="700">LẮP RÁP &amp; THỬ</text>

    <!-- Illustration 4 -->
    <rect x="14" y="46" width="140" height="110" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <g transform="translate(84, 101)">
      <!-- Outer lantern with translucent skin -->
      <rect x="-35" y="-45" width="70" height="85" fill="#fef9c3" fill-opacity="0.6" stroke="#15803d" stroke-width="1.5" rx="3"/>
      <!-- Soft projected shadow inside -->
      <circle cx="-10" cy="0" r="6" fill="#78350f" fill-opacity="0.35"/>
      <rect x="-14" y="6" width="8" height="18" fill="#78350f" fill-opacity="0.35"/>
      <!-- Candle flame below -->
      <circle cx="0" cy="30" r="3" fill="#ea580c"/>
      <!-- Spinning motion arrows -->
      <path d="M-20,-48 A24,8 0 1,1 20,-48" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </g>

    <!-- Content Bullet Points -->
    <text x="14" y="172" fill="#0f172a" font-size="11" font-weight="700">• Bọc giấy can lồng ngoài</text>
    <text x="14" y="190" fill="#475569" font-size="10">Dán phẳng giấy nến/can mờ</text>
    <text x="14" y="204" fill="#475569" font-size="10">làm màn hứng bóng chiếu.</text>

    <text x="14" y="226" fill="#0f172a" font-size="11" font-weight="700">• Đặt lồng quay lên kim</text>
    <text x="14" y="244" fill="#475569" font-size="10">Kiểm tra độ trơn trượt,</text>
    <text x="14" y="258" fill="#475569" font-size="10">thổi nhẹ xem quay mượt.</text>

    <text x="14" y="280" fill="#0f172a" font-size="11" font-weight="700">• Thắp nến &amp; vận hành</text>
    <text x="14" y="296" fill="#475569" font-size="10">Đèn tự quay sau 20–30s.</text>
  </g>
</svg>
