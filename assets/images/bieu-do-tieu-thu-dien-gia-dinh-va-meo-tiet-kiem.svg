<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="840" height="450" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="838" height="448" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Section -->
  <text x="420" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#087858" text-anchor="middle">CƠ CẤU TIÊU THỤ ĐIỆN GIA ĐÌNH &amp; GIẢI PHÁP TIẾT KIỆM</text>
  <text x="420" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Nắm rõ thiết bị tiêu tốn điện nhiều nhất để áp dụng giải pháp cắt giảm chi phí hiệu quả</text>

  <!-- LEFT COLUMN: CONSUMPTION BREAKDOWN (BAR CHART) -->
  <g transform="translate(35, 90)" filter="url(#shadow2)">
    <rect width="365" height="325" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="365" height="38" rx="12" fill="#087858"/>
    <rect y="26" width="365" height="12" fill="#087858"/>
    <text x="182" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TỶ LỆ TIÊU THỤ ĐIỆN THEO THIẾT BỊ</text>

    <!-- Item 1: Điều hòa (45%) -->
    <g transform="translate(20, 58)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">1. Điều hòa không khí (Máy lạnh)</text>
      <text x="325" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d94e48" text-anchor="end">45%</text>
      <rect y="22" width="325" height="12" rx="6" fill="#f1f5f9"/>
      <rect y="22" width="146" height="12" rx="6" fill="#d94e48"/>
    </g>

    <!-- Item 2: Bình nóng lạnh (18%) -->
    <g transform="translate(20, 110)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">2. Bình nóng lạnh (Bình tắm)</text>
      <text x="325" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="end">18%</text>
      <rect y="22" width="325" height="12" rx="6" fill="#f1f5f9"/>
      <rect y="22" width="58" height="12" rx="6" fill="#b45309"/>
    </g>

    <!-- Item 3: Tủ lạnh (15%) -->
    <g transform="translate(20, 162)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">3. Tủ lạnh (chạy 24/24)</text>
      <text x="325" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">15%</text>
      <rect y="22" width="325" height="12" rx="6" fill="#f1f5f9"/>
      <rect y="22" width="48" height="12" rx="6" fill="#0284c7"/>
    </g>

    <!-- Item 4: Nấu nướng: Bếp từ, nồi cơm (12%) -->
    <g transform="translate(20, 214)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">4. Bếp từ &amp; Thiết bị nấu nướng</text>
      <text x="325" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end">12%</text>
      <rect y="22" width="325" height="12" rx="6" fill="#f1f5f9"/>
      <rect y="22" width="39" height="12" rx="6" fill="#64748b"/>
    </g>

    <!-- Item 5: Chiếu sáng, quạt, TV, Standby (10%) -->
    <g transform="translate(20, 266)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">5. Chiếu sáng, TV &amp; Nguồn chờ</text>
      <text x="325" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#087858" text-anchor="end">10%</text>
      <rect y="22" width="325" height="12" rx="6" fill="#f1f5f9"/>
      <rect y="22" width="32" height="12" rx="6" fill="#087858"/>
    </g>
  </g>

  <!-- RIGHT COLUMN: 4 PILLARS OF SAVING -->
  <g transform="translate(435, 90)" filter="url(#shadow2)">
    <rect width="370" height="325" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="370" height="38" rx="12" fill="#1e293b"/>
    <rect y="26" width="370" height="12" fill="#1e293b"/>
    <text x="185" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4 NGUYÊN TẮC VÀNG TIẾT KIỆM ĐIỆN</text>

    <!-- Pillar 1 -->
    <g transform="translate(16, 52)">
      <rect width="338" height="54" rx="8" fill="#e8f5ee" stroke="#b7dcc8"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#087858">1. Quy tắc điều hòa 26°C - 28°C</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Kết hợp quạt gió thoang thoảng; giảm 2 - 3% điện mỗi độ</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(16, 116)">
      <rect width="338" height="54" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d94e48">2. Không cắm bình nóng lạnh 24/24</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Chỉ bật trước tắm 10 - 15 phút, vừa tiết kiệm vừa an toàn</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(16, 180)">
      <rect width="338" height="54" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">3. Triệt tiêu dòng điện chờ (Standby)</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Rút phích cắm TV, sạc dự phòng, PC khi không sử dụng</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(16, 244)">
      <rect width="338" height="54" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">4. Chọn nhãn năng lượng 5 sao &amp; Inverter</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Tiết kiệm 30 - 50% điện năng trong suốt vòng đời máy</text>
    </g>
  </g>
</svg>
