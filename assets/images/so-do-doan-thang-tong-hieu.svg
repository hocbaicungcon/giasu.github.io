<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SƠ ĐỒ ĐOẠN THẲNG BÀI TOÁN TỔNG - HIỆU</text>
  
  <!-- Số lớn -->
  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số lớn:</text>
  <rect x="110" y="50" width="220" height="22" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="330" y="50" width="90" height="22" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="375" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">Hiệu (H)</text>

  <!-- Số bé -->
  <text x="40" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Số bé:</text>
  <rect x="110" y="100" width="220" height="22" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Dấu ngoặc Tổng -->
  <path d="M 430 48 C 455 86, 455 86, 430 124" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="465" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tổng T</text>

  <!-- Công thức chân trang -->
  <text x="270" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Số lớn = (Tổng + Hiệu) : 2  |  Số bé = (Tổng − Hiệu) : 2</text>
</svg>
