<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="100%" height="auto" style="max-width:740px;display:block;margin:1.5rem auto;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Step Box Headers -->
    <linearGradient id="headStarch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="headSugar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="headAlcohol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <marker id="arrWine" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>

    <filter id="shadowWine" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="740" height="480" rx="14" fill="url(#bgWine)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="90" y="14" width="560" height="34" rx="17" fill="#0f172a" filter="url(#shadowWine)"/>
  <text x="370" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">CƠ CHẾ HÓA SINH 3 GIAI ĐOẠN LÊN MEN CƠM RƯỢU NẾP TRUYỀN THỐNG</text>

  <!-- ================= TOP: 3 BIOCHEMICAL STAGES ================= -->

  <!-- STAGE 1: STARCH (Tinh bột gạo nếp) -->
  <g transform="translate(30, 75)">
    <rect width="200" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowWine)"/>
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,32 L0,32 Z" fill="url(#headStarch)"/>
    <text x="100" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">1. TINH BỘT NẾP</text>

    <!-- Starch Polymer Chain Graphic -->
    <g transform="translate(100, 75)">
      <!-- Hexagonal Glucose Units linked -->
      <polygon points="-55,-12 -45,-22 -30,-22 -20,-12 -30,-2 -45,-2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="-20" y1="-12" x2="-10" y2="-12" stroke="#64748b" stroke-width="2"/>
      <polygon points="-10,-12 0,-22 15,-22 25,-12 15,-2 0,-2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="25" y1="-12" x2="35" y2="-12" stroke="#64748b" stroke-width="2"/>
      <polygon points="35,-12 45,-22 60,-22 70,-12 60,-2 45,-2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="5" y="16" text-anchor="middle" fill="#78350f" font-size="11" font-weight="700">(C₆H₁₀O₅)ₙ</text>
    </g>

    <!-- Formula & Explanation -->
    <rect x="12" y="110" width="176" height="75" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="20" y="128" fill="#92400e" font-size="11" font-weight="700">• Nguyên liệu: Gạo nếp</text>
    <text x="20" y="145" fill="#475569" font-size="10.5">• Nấu chín thành xôi dẻo</text>
    <text x="20" y="162" fill="#475569" font-size="10.5">• Tinh bột hồ hóa, sẵn sàng</text>
    <text x="20" y="177" fill="#475569" font-size="10.5">cho enzym tiếp cận</text>
  </g>

  <!-- Arrow 1 -> 2: Đường hóa (Amylase từ nấm mốc) -->
  <g transform="translate(235, 160)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrWine)"/>
    <text x="14" y="-12" text-anchor="middle" fill="#d97706" font-size="10" font-weight="800">ĐƯỜNG HÓA</text>
    <text x="14" y="16" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="600">Amylase</text>
    <text x="14" y="27" text-anchor="middle" fill="#64748b" font-size="8.5">(Nấm mốc)</text>
  </g>

  <!-- STAGE 2: GLUCOSE SUGAR (Đường Glucozo vị ngọt) -->
  <g transform="translate(270, 75)">
    <rect width="200" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowWine)"/>
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,32 L0,32 Z" fill="url(#headSugar)"/>
    <text x="100" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">2. ĐƯỜNG GLUCOZƠ</text>

    <!-- Free Glucose Ring Graphic -->
    <g transform="translate(100, 75)">
      <polygon points="-25,-12 -15,-25 15,-25 25,-12 15,2 -15,2" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
      <circle cx="-15" cy="-25" r="3" fill="#ef4444"/>
      <circle cx="15" cy="-25" r="3" fill="#ef4444"/>
      <text x="0" y="-8" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="800">C₆H₁₂O₆</text>
      <text x="0" y="20" text-anchor="middle" fill="#075985" font-size="11" font-weight="700">Vị ngọt sắc</text>
    </g>

    <!-- Formula & Explanation -->
    <rect x="12" y="110" width="176" height="75" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="20" y="128" fill="#0369a1" font-size="11" font-weight="700">• Thủy phân tinh bột:</text>
    <text x="20" y="145" fill="#0f172a" font-size="10" font-weight="600">(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆</text>
    <text x="20" y="162" fill="#475569" font-size="10.5">• Cơm tiết nước đường ngọt</text>
    <text x="20" y="177" fill="#475569" font-size="10.5">• Sau 24 – 36h ủ ấm ban đầu</text>
  </g>

  <!-- Arrow 2 -> 3: Rượu hóa (Zymase từ nấm men) -->
  <g transform="translate(475, 160)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrWine)"/>
    <text x="14" y="-12" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="800">RƯỢU HÓA</text>
    <text x="14" y="16" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="600">Zymase</text>
    <text x="14" y="27" text-anchor="middle" fill="#64748b" font-size="8.5">(Nấm men)</text>
  </g>

  <!-- STAGE 3: ETHANOL & ESTER (Cơm rượu thơm nồng) -->
  <g transform="translate(510, 75)">
    <rect width="200" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowWine)"/>
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,32 L0,32 Z" fill="url(#headAlcohol)"/>
    <text x="100" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">3. RƯỢU &amp; ESTE THƠM</text>

    <!-- Wine Jar / Bowl Graphic -->
    <g transform="translate(100, 70)">
      <ellipse cx="0" cy="18" rx="30" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <path d="M-30,18 C-30,35 30,35 30,18 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="-10" cy="22" r="2.5" fill="#ffffff"/>
      <circle cx="8" cy="24" r="2" fill="#ffffff"/>
      <text x="0" y="10" text-anchor="middle" fill="#166534" font-size="11.5" font-weight="800">C₂H₅OH + CO₂</text>
    </g>

    <!-- Formula & Explanation -->
    <rect x="12" y="110" width="176" height="75" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="20" y="128" fill="#15803d" font-size="11" font-weight="700">• Lên men rượu etylic:</text>
    <text x="20" y="145" fill="#0f172a" font-size="10" font-weight="600">C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</text>
    <text x="20" y="162" fill="#475569" font-size="10.5">• Lên men axit &amp; este hóa</text>
    <text x="20" y="177" fill="#475569" font-size="10.5">tạo hương thơm dịu mát</text>
  </g>

  <!-- ================= BOTTOM: 4-STEP CULINARY PROCEDURE ================= -->
  <g transform="translate(30, 295)">
    <rect width="680" height="165" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowWine)"/>
    <rect width="680" height="28" rx="10" fill="#0f172a"/>
    <text x="340" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">QUY TRÌNH 4 BƯỚC LÀM CƠM RƯỢU NẾP CHUẨN KHOA HỌC</text>

    <!-- Step 1 -->
    <rect x="15" y="38" width="150" height="115" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <circle cx="30" cy="52" r="8" fill="#d97706"/>
    <text x="30" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">1</text>
    <text x="44" y="56" fill="#b45309" font-size="11" font-weight="700">Nấu xôi nếp</text>
    <text x="22" y="74" fill="#475569" font-size="9.5">• Vo sạch 500g gạo nếp</text>
    <text x="22" y="88" fill="#475569" font-size="9.5">• Nấu xôi chín dẻo, ráo hạt</text>
    <text x="22" y="102" fill="#475569" font-size="9.5">• Xới ra khay sạch, tãi mỏng</text>
    <text x="22" y="116" fill="#475569" font-size="9.5">• Để nguội về ấm tay (~30°C)</text>
    <text x="22" y="130" fill="#dc2626" font-size="9" font-weight="700">(Xôi nóng sẽ làm chết men)</text>

    <!-- Step 2 -->
    <rect x="180" y="38" width="150" height="115" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="195" cy="52" r="8" fill="#0284c7"/>
    <text x="195" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">2</text>
    <text x="209" y="56" fill="#0369a1" font-size="11" font-weight="700">Nghiền &amp; Rắc men</text>
    <text x="187" y="74" fill="#475569" font-size="9.5">• Dùng 1 viên men thuốc bắc</text>
    <text x="187" y="88" fill="#475569" font-size="9.5">• Cạo sạch vỏ trấu, giã mịn</text>
    <text x="187" y="102" fill="#475569" font-size="9.5">• Rây bột men đều khắp 2 mặt</text>
    <text x="187" y="116" fill="#475569" font-size="9.5">xôi nếp đã ấm nguội</text>
    <text x="187" y="130" fill="#0369a1" font-size="9" font-weight="600">• Trộn nhẹ tránh nát hạt xôi</text>

    <!-- Step 3 -->
    <rect x="345" y="38" width="150" height="115" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
    <circle cx="360" cy="52" r="8" fill="#c026d3"/>
    <text x="360" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">3</text>
    <text x="374" y="56" fill="#a21caf" font-size="11" font-weight="700">Vo viên &amp; Vào hũ</text>
    <text x="352" y="74" fill="#475569" font-size="9.5">• Nhúng tay vào nước muối nhạt</text>
    <text x="352" y="88" fill="#475569" font-size="9.5">• Vo xôi thành từng viên tròn</text>
    <text x="352" y="102" fill="#475569" font-size="9.5">• Xếp viên xôi vào hũ thủy tinh</text>
    <text x="352" y="116" fill="#475569" font-size="9.5">• Chừa một lỗ hõm ở giữa hũ</text>
    <text x="352" y="130" fill="#a21caf" font-size="9" font-weight="600">để hứng nước rượu tiết ra</text>

    <!-- Step 4 -->
    <rect x="510" y="38" width="155" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="525" cy="52" r="8" fill="#16a34a"/>
    <text x="525" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">4</text>
    <text x="539" y="56" fill="#15803d" font-size="11" font-weight="700">Ủ ấm &amp; Thu hoạch</text>
    <text x="517" y="74" fill="#475569" font-size="9.5">• Đậy nắp hờ (không vặn kín mít)</text>
    <text x="517" y="88" fill="#475569" font-size="9.5">• Đặt nơi kín gió ở 28°C – 32°C</text>
    <text x="517" y="102" fill="#475569" font-size="9.5">• Sau 48 – 72h: nước rượu ứa ra,</text>
    <text x="517" y="116" fill="#475569" font-size="9.5">vị ngọt thanh, thơm nồng dịu</text>
    <text x="517" y="130" fill="#15803d" font-size="9" font-weight="700">• Bảo quản tủ lạnh dùng dần</text>
  </g>
</svg>
