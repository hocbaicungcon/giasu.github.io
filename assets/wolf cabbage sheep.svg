<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #7f8c8d; text-anchor: middle; }
      .grid-line { stroke: #e0e0e0; stroke-dasharray: 4; stroke-width: 1; }
    </style>
  </defs>

  <!-- Nền sprite sheet -->
  <rect width="1000" height="650" class="bg"/>

  <!-- ================= 1. NGƯỜI LÁI THUYỀN (FARMER) ================= -->
  <g id="element-farmer" transform="translate(50, 40)">
    <rect x="-10" y="-10" width="140" height="190" fill="none"/>
    <!-- Chân -->
    <rect x="42" y="120" width="14" height="40" rx="4" fill="#7f8c8d"/>
    <rect x="64" y="120" width="14" height="40" rx="4" fill="#7f8c8d"/>
    <!-- Thân / Áo -->
    <path d="M 35,60 L 85,60 L 95,120 L 25,120 Z" fill="#e67e22"/>
    <!-- Đai lưng -->
    <rect x="25" y="95" width="70" height="10" fill="#d35400"/>
    <!-- Tay -->
    <rect x="18" y="60" width="15" height="45" rx="7" fill="#e67e22" transform="rotate(15 18 60)"/>
    <rect x="87" y="60" width="15" height="45" rx="7" fill="#e67e22" transform="rotate(-15 87 60)"/>
    <!-- Đầu & Mặt -->
    <circle cx="60" cy="35" r="22" fill="#ffcc99"/>
    <!-- Tóc -->
    <path d="M 38,30 C 38,10 82,10 82,30 C 75,18 45,18 38,30 Z" fill="#6e2c00"/>
    <!-- Mắt & Miệng -->
    <circle cx="52" cy="35" r="2.5" fill="#2c3e50"/>
    <circle cx="68" cy="35" r="2.5" fill="#2c3e50"/>
    <path d="M 55,45 Q 60,50 65,45" stroke="#2c3e50" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Nón lá/Mũ -->
    <polygon points="60,2 20,25 100,25" fill="#f1c40f"/>
    <text x="60" y="175" class="label">#farmer</text>
  </g>

  <!-- ================= 2. CON SÓI (WOLF) ================= -->
  <g id="element-wolf" transform="translate(230, 40)">
    <!-- Đuôi -->
    <path d="M 25,100 Q -10,80 0,130 Q 20,130 30,110 Z" fill="#4f5b66"/>
    <!-- Thân -->
    <path d="M 30,70 Q 70,40 110,70 Q 130,110 110,140 L 30,140 Z" fill="#6c7a89"/>
    <!-- Đầu -->
    <polygon points="80,60 150,75 100,115" fill="#6c7a89"/>
    <polygon points="120,68 150,75 130,90" fill="#4f5b66"/>
    <circle cx="148" cy="75" r="3.5" fill="#2c3e50"/>
    <polygon points="85,63 80,25 100,55" fill="#4f5b66"/>
    <circle cx="105" cy="75" r="3.5" fill="#f1c40f"/>
    <circle cx="106" cy="75" r="1.8" fill="#000"/>
    <!-- Chân -->
    <rect x="40" y="130" width="14" height="40" rx="5" fill="#4f5b66"/>
    <rect x="90" y="130" width="14" height="40" rx="5" fill="#4f5b66"/>
    <text x="75" y="185" class="label">#wolf</text>
  </g>

  <!-- ================= 3. CON CỪU (SHEEP) ================= -->
  <g id="element-sheep" transform="translate(430, 40)">
    <!-- Chân -->
    <rect x="45" y="110" width="12" height="45" rx="4" fill="#7f8c8d"/>
    <rect x="103" y="110" width="12" height="45" rx="4" fill="#7f8c8d"/>
    <!-- Thân (Lông) -->
    <circle cx="60" cy="70" r="30" fill="#ecf0f1"/>
    <circle cx="90" cy="50" r="30" fill="#ecf0f1"/>
    <circle cx="110" cy="80" r="30" fill="#ecf0f1"/>
    <circle cx="80" cy="90" r="30" fill="#ecf0f1"/>
    <circle cx="50" cy="90" r="22" fill="#ecf0f1"/>
    <!-- Đầu -->
    <ellipse cx="140" cy="55" rx="22" ry="16" fill="#95a5a6"/>
    <ellipse cx="130" cy="45" rx="10" ry="5" fill="#7f8c8d" transform="rotate(-30 130 45)"/>
    <circle cx="148" cy="50" r="3" fill="#2c3e50"/>
    <text x="80" y="175" class="label">#sheep</text>
  </g>

  <!-- ================= 4. BẮP CẢI (CABBAGE) ================= -->
  <g id="element-cabbage" transform="translate(630, 50)">
    <circle cx="60" cy="70" r="45" fill="#27ae60"/>
    <path d="M 20,60 Q 60,10 100,60 Q 60,110 20,60 Z" fill="#2ecc71"/>
    <circle cx="60" cy="65" r="25" fill="#a3e4d7"/>
    <path d="M 60,90 L 60,65" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60,75 L 50,65" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 60,80 L 70,72" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="145" class="label">#cabbage</text>
  </g>

  <!-- ================= 5. CON THUYỀN (BOAT) & MÁI CHÈO ================= -->
  <g id="element-boat" transform="translate(50, 240)">
    <!-- Con thuyền -->
    <path d="M 10,10 Q 30,80 120,80 L 230,80 Q 320,80 340,10 Z" fill="#8d6e63"/>
    <path d="M 0,0 Q 30,95 120,95 L 230,95 Q 320,95 350,0 Q 280,70 175,70 Q 70,70 0,0 Z" fill="#5d4037"/>
    <rect x="70" y="25" width="10" height="40" fill="#4e342e" transform="rotate(15)"/>
    <rect x="250" y="10" width="10" height="40" fill="#4e342e" transform="rotate(-15)"/>
    <text x="175" y="125" class="label">#boat</text>
  </g>

  <g id="element-oar" transform="translate(440, 270)">
    <!-- Mái chèo -->
    <rect x="0" y="8" width="140" height="6" rx="3" fill="#b17a47"/>
    <path d="M 130,0 C 150,0 160,5 160,11 C 160,17 150,22 130,22 Z" fill="#8d5b28"/>
    <text x="80" y="55" class="label">#oar</text>
  </g>

  <!-- ================= 6. BỜ SÔNG TRÁI & PHẢI (BANKS) ================= -->
  <g id="element-bank-left" transform="translate(50, 420)">
    <path d="M 0,0 L 220,0 Q 200,60 210,120 L 0,120 Z" fill="#27ae60"/>
    <path d="M 0,120 L 210,120 Q 215,140 200,150 L 0,150 Z" fill="#d35400"/>
    <text x="100" y="175" class="label">#left-bank</text>
  </g>

  <g id="element-bank-right" transform="translate(710, 420)">
    <path d="M 40,0 Q 50,60 30,120 L 240,120 L 240,0 Z" fill="#2ecc71"/>
    <path d="M 30,120 Q 45,135 40,150 L 240,150 L 240,120 Z" fill="#d35400"/>
    <!-- Mấy cây nhỏ trang trí bờ -->
    <circle cx="150" cy="-10" r="15" fill="#1e8449"/>
    <circle cx="180" cy="-20" r="20" fill="#1e8449"/>
    <text x="140" y="175" class="label">#right-bank</text>
  </g>

  <!-- ================= 7. DÒNG SÔNG / NƯỚC (RIVER TILES) ================= -->
  <g id="element-river" transform="translate(310, 420)">
    <rect x="0" y="0" width="370" height="120" fill="#3498db" rx="5"/>
    <!-- Sóng nước -->
    <path d="M 20,30 Q 50,20 80,30 T 140,30" stroke="#5dade2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 180,70 Q 210,60 240,70 T 300,70" stroke="#5dade2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 80,100 Q 110,90 140,100 T 200,100" stroke="#5dade2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="185" y="150" class="label">#river-water</text>
  </g>

</svg>
