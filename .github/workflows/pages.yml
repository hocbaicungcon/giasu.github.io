name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install LaTeX tools when posts contain TeX
        # Keep the tools available even after a cache hit (missing/corrupt images can be rebuilt).
        if: hashFiles('post/*.tex', 'post/*.TEX') != ''
        run: |
          sudo apt-get update
          # latex-extra brings latex-base/recommended; pictures supplies TikZ and tkz-*.
          # lang-other supplies VnTeX. Linux uses pdftocairo, so dvisvgm is unnecessary.
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-pictures \
            texlive-lang-other \
            poppler-utils \
            curl unzip
          bash scripts/install-fontawesome5.sh
          for file in standalone.cls fix-cm.sty amsmath.sty amssymb.sty tikz.sty tkz-tab.sty tkz-euclide.sty vietnam.sty t5enc.def fontawesome5.sty; do
            kpsewhich "$file"
          done
          # Exercise the actual renderer preamble, including embedded icon fonts.
          work=$(mktemp -d)
          cat > "$work/check.tex" <<'TEX'
          \documentclass[tikz,border=6pt]{standalone}
          \usepackage{fix-cm}
          \usepackage[utf8]{vietnam}
          \usepackage{amsmath,amssymb,tkz-tab,fontawesome5,tkz-euclide}
          \begin{document}
          \begin{tikzpicture}
          \node {Tiếng Việt \faBook~\faIcon{graduation-cap} $\mathbb{R}$};
          \end{tikzpicture}
          \end{document}
          TEX
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory="$work" "$work/check.tex"
          pdftocairo -svg "$work/check.pdf" "$work/check.svg"
          test -s "$work/check.svg"
      - name: Restore and save TikZ SVG cache
        if: hashFiles('post/*.tex', 'post/*.TEX') != ''
        uses: actions/cache@v6
        with:
          path: .generated/tikz/*/figure.svg
          # Invalidate when the renderer, styles or build environment changes.
          key: tikz-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/latex.mjs', 'assets/style.css', '.github/workflows/pages.yml', 'scripts/install-fontawesome5.sh') }}-${{ hashFiles('post/*.tex', 'post/*.TEX') }}
          # Reuse unchanged figures when a post is added or edited.
          restore-keys: |
            tikz-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/latex.mjs', 'assets/style.css', '.github/workflows/pages.yml', 'scripts/install-fontawesome5.sh') }}-
      - name: Install dependencies
        run: npm ci
      - name: Test Markdown and mathematics
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
