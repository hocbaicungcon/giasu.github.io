.pb{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #cfe0d9;border-radius:8px;padding:5px 7px;font-size:12px;font-weight:800;color:#0b2e2c;margin-bottom:6px}
.pb img{width:20px;height:20px}
.pbtn{margin-top:10px;background:#127160;color:#fff;font-weight:800;font-size:12px;text-align:center;padding:6px;border-radius:8px}
.base{position:relative;width:560px;height:20px;background:linear-gradient(#e4e7e8,#b9bec1);border-radius:2px 2px 18px 18px;box-shadow:0 20px 30px rgba(0,0,0,.4)}
.base:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:110px;height:7px;background:#9ba1a5;border-radius:0 0 10px 10px}
.mac{position:absolute;width:560px;transform-origin:top left;transform:scale(.66)}
.mac.m{left:870px;top:330px;z-index:2}
.mac.w{left:700px;top:150px;z-index:1}
.w .lid{background:#16181a;border-radius:10px 10px 4px 4px;border-color:#33373a;padding:10px}
.w .base{height:14px;background:linear-gradient(#cfd3d5,#8d9296);border-radius:0 0 10px 10px}
.w .base:before{width:90px;height:5px}
.tb{position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(20,40,48,.92);display:flex;justify-content:center;align-items:center;gap:8px}
.wl{display:grid;grid-template-columns:7px 7px;gap:1.5px}.wl i{display:block;width:7px;height:7px;background:#4cc2ff}
.tag{position:absolute;font-weight:900;font-size:26px;background:#fff;color:#084442;padding:6px 18px;border-radius:30px;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.35)}
